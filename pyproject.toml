[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlhat-reproduction-team"
version = "0.1.0"
description = "Research-course scaffold for independent MLHAT reproduction (not yet implemented)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data = [
  "datasets>=2.18,<5",
  "huggingface_hub>=0.24,<2"
]
tracking = ["wandb>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
